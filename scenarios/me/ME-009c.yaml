cenario: ME-009c preço teórico, critério 3 - desequilíbrio comprador leva ao maior preço
regras: [RN-AUC-010]
entradas:
  instrumento: { band_reference_price: '10.00', auction_random_end_max_s: 0 }
  fase: PRE_OPENING
  comandos:
    - { t: 1, cmd: PhaseChange, fase: PRE_OPENING, auction_id: L1, auction_end_t: 10 }
    - { t: 2, cmd: NewOrder, id: B1, side: BUY, qty: 300, price: '10.05', account: A }
    - { t: 3, cmd: NewOrder, id: S1, side: SELL, qty: 100, price: '10.01', account: B }
    # Candidato 10,05 com o mesmo executável e desequilíbrio de 10,01, ambos do lado comprador.
    - { t: 4, cmd: NewOrder, id: B2, side: BUY, qty: 100, price: '10.01', account: C }
    - { t: 5, cmd: CancelOrder, id: B2 }
    - { t: 10, cmd: PhaseChange, fase: CONTINUOUS, concludes: L1 }
saidas_esperadas:
  trades:
    - { buy: B1, sell: S1, price: '10.05', qty: 100, auction: L1 }
  canceladas:
    - { id: B2, qty: 100, reason: CUSTOMER_REQUEST }
  leiloes:
    - { evento: FIM, price: '10.05', qty: 100, fim_efetivo_t: 10 }
  livro_final:
    bids: [{ price: '10.05', orders: [{ id: B1, qty: 200 }] }]
    asks: []
  fase: CONTINUOUS
