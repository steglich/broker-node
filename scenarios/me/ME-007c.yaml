cenario: ME-007c STP CANCEL_BOTH cancela as duas; o FMS não é self-trade com cliente
regras: [RN-SLF-002, RN-SLF-003]
entradas:
  comandos:
    - { t: 1, cmd: NewOrder, id: S1, side: SELL, qty: 100, price: '10.00', account: X }
    - {
        t: 2,
        cmd: NewOrder,
        id: B1,
        side: BUY,
        qty: 100,
        price: '10.00',
        stp: CANCEL_BOTH,
        account: X,
      }
    - {
        t: 3,
        cmd: NewOrder,
        id: M1,
        side: SELL,
        qty: 100,
        price: '10.00',
        account: FMS,
        participant: MARKET_MAKER,
      }
    - { t: 4, cmd: NewOrder, id: B2, side: BUY, qty: 100, price: '10.00', account: X }
saidas_esperadas:
  trades:
    - { buy: B2, sell: M1, price: '10.00', qty: 100 }
  canceladas:
    - { id: S1, qty: 100, reason: SELF_TRADE_PREVENTION }
    - { id: B1, qty: 100, reason: SELF_TRADE_PREVENTION }
  livro_final: { bids: [], asks: [] }
  fase: CONTINUOUS
