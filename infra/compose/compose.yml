# Ambiente local do broker-node (D22, spec local-environment).
#
# Perfis:
#   (sem perfil) infra   infraestrutura + simuladores; sobe sempre
#   core                 + serviços do núcleo (identity, ledger, oms, risk, motor, gateways...)
#   full                 + todos os serviços do catálogo
# Use `pnpm env:up [infra|core|full]`, que gera segredos e certificados antes de subir.
name: broker

x-limits: &small
  deploy:
    resources:
      limits:
        memory: 256m

# Base dos simuladores externos (Sistemas simulados): mesma imagem única, latência e falhas
# configuráveis por variável (RN-SIM-002), UI de inspeção em /ui (RN-SIM-005).
x-simulator-env: &simulator-env
  ENVIRONMENT: ${BROKER_ENVIRONMENT:-local}
  PORT: '8080'
  DB_HOST: postgres
  SIM_LATENCY_MS: ${SIM_LATENCY_MS:-0}
  SIM_TRANSIENT_ERROR_RATE: ${SIM_TRANSIENT_ERROR_RATE:-0}
  SIM_DEFINITIVE_ERROR_RATE: ${SIM_DEFINITIVE_ERROR_RATE:-0}
  SIM_UNAVAILABLE: ${SIM_UNAVAILABLE:-}

x-ready-check: &ready-check
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://localhost:8080/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 20

networks:
  broker:
    name: broker

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  lgtm-data:

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  rabbitmq_password:
    file: ../secrets/rabbitmq_password
  valkey_password:
    file: ../secrets/valkey_password
  minio_root_password:
    file: ../secrets/minio_root_password
  grafana_admin_password:
    file: ../secrets/grafana_admin_password
  db_example_app:
    file: ../secrets/db/example_app
  db_example_migrator:
    file: ../secrets/db/example_migrator
  db_scheduler_app:
    file: ../secrets/db/scheduler_app
  db_scheduler_migrator:
    file: ../secrets/db/scheduler_migrator
  db_identity_app:
    file: ../secrets/db/identity_app
  db_identity_migrator:
    file: ../secrets/db/identity_migrator
  identity_field_master_key:
    file: ../secrets/crypto/identity_field_master_key
  identity_blind_index_key:
    file: ../secrets/crypto/identity_blind_index_key
  db_customer_app:
    file: ../secrets/db/customer_app
  db_customer_migrator:
    file: ../secrets/db/customer_migrator
  customer_field_master_key:
    file: ../secrets/crypto/customer_field_master_key
  customer_blind_index_key:
    file: ../secrets/crypto/customer_blind_index_key
  db_ledger_app:
    file: ../secrets/db/ledger_app
  db_ledger_migrator:
    file: ../secrets/db/ledger_migrator
  ledger_blind_index_key:
    file: ../secrets/crypto/ledger_blind_index_key
  db_reference_data_app:
    file: ../secrets/db/reference_data_app
  db_reference_data_migrator:
    file: ../secrets/db/reference_data_migrator
  db_market_data_app:
    file: ../secrets/db/market_data_app
  db_market_data_migrator:
    file: ../secrets/db/market_data_migrator
  # Tokens da brapi (RN-BRP-090/094); vazios no local, que usa as fixtures (RN-BRP-095).
  brapi_token:
    file: ../secrets/brapi/token
  brapi_token_next:
    file: ../secrets/brapi/token_next
  db_audit_app:
    file: ../secrets/db/audit_app
  db_audit_migrator:
    file: ../secrets/db/audit_migrator
  db_pix_simulator_app:
    file: ../secrets/db/pix_simulator_app
  db_pix_simulator_migrator:
    file: ../secrets/db/pix_simulator_migrator
  db_kyc_simulator_app:
    file: ../secrets/db/kyc_simulator_app
  db_kyc_simulator_migrator:
    file: ../secrets/db/kyc_simulator_migrator
  db_message_sink_app:
    file: ../secrets/db/message_sink_app
  db_message_sink_migrator:
    file: ../secrets/db/message_sink_migrator
  # Segredos HMAC dos webhooks (RN-SIM-003): o simulador assina, o receptor do núcleo confere.
  webhook_pix_simulator:
    file: ../secrets/webhook/pix_simulator
  webhook_kyc_simulator:
    file: ../secrets/webhook/kyc_simulator

services:
  # ---------------------------------------------------------------- infraestrutura
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - ../postgres/services.txt:/etc/broker/services.txt:ro
      # Senhas por serviço: o init lê todas; cada serviço recebe só as suas como secret.
      - ../secrets/db:/run/secrets/db:ro
    ports: ['${POSTGRES_PORT:-5432}:5432']
    networks: [broker]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    # A senha do usuário padrão vem do secret, gravada num conf.d antes do servidor subir.
    entrypoint:
      - sh
      - -c
      - |
        printf 'default_pass = %s\n' "$$(cat /run/secrets/rabbitmq_password)" > /etc/rabbitmq/conf.d/90-secret.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets: [rabbitmq_password]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-broker.conf:ro
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_STREAM_PORT:-5552}:5552'
      - '${RABBITMQ_UI_PORT:-15672}:15672'
    networks: [broker]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'rabbitmq-diagnostics -q check_port_listener 5552 && rabbitmq-diagnostics -q check_running',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  valkey:
    image: valkey/valkey:8.1.10-alpine
    # Cache efêmero: sem RDB e sem AOF (D16). Reiniciar o contêiner zera o conteúdo.
    command:
      - sh
      - -c
      - exec valkey-server --save '' --appendonly no --requirepass "$$(cat /run/secrets/valkey_password)"
    secrets: [valkey_password]
    ports: ['${VALKEY_PORT:-6380}:6379']
    networks: [broker]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'valkey-cli -a "$$(cat /run/secrets/valkey_password)" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *small

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: broker
      MINIO_ROOT_PASSWORD_FILE: minio_root_password
    secrets: [minio_root_password]
    volumes:
      - minio-data:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    networks: [broker]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ['/bin/sh', '/init.sh']
    secrets: [minio_root_password]
    volumes:
      - ../minio/init.sh:/init.sh:ro
    networks: [broker]
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31.6
    # Caixa de captura de e-mail (RN-MSG-001): TODA mensagem fica aqui. Só os destinatários da lista
    # de permissão MAIL_RELAY_ALLOWLIST (regex, ex.: ^dev@exemplo\.com$) são repassados a um SMTP
    # real, e só se MAIL_RELAY_HOST estiver definido. Lista vazia: nada sai, nem pelo "release" da UI.
    # Verificado por apps/message-sink/test/mailpit-allowlist.test.ts, que lê este bloco.
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_SMTP_RELAY_HOST: ${MAIL_RELAY_HOST:-}
      MP_SMTP_RELAY_PORT: ${MAIL_RELAY_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: ${MAIL_RELAY_STARTTLS:-true}
      MP_SMTP_RELAY_ALLOW_INSECURE: ${MAIL_RELAY_ALLOW_INSECURE:-false}
      MP_SMTP_RELAY_AUTH: ${MAIL_RELAY_AUTH:-none}
      MP_SMTP_RELAY_USERNAME: ${MAIL_RELAY_USERNAME:-}
      MP_SMTP_RELAY_PASSWORD: ${MAIL_RELAY_PASSWORD:-}
      MP_SMTP_RELAY_MATCHING: ${MAIL_RELAY_ALLOWLIST:-}
      MP_SMTP_RELAY_ALLOWED_RECIPIENTS: ${MAIL_RELAY_ALLOWLIST:-^$}
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    networks: [broker]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      traefik.enable: 'true'
      traefik.http.routers.mail.rule: Host(`mail.broker.localhost`)
      traefik.http.routers.mail.entrypoints: websecure
      traefik.http.services.mail.loadbalancer.server.port: '8025'
    <<: *small

  lgtm:
    image: grafana/otel-lgtm:0.37.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets: [grafana_admin_password]
    volumes:
      - lgtm-data:/data
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
      - '${OTLP_GRPC_PORT:-4317}:4317'
      - '${OTLP_HTTP_PORT:-4318}:4318'
    networks: [broker]
    healthcheck:
      # O run-all.sh do otel-lgtm cria /tmp/ready quando todos os componentes respondem.
      test: ['CMD-SHELL', 'test -f /tmp/ready']
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536m

  certs:
    build: ../mkcert
    image: broker/mkcert:local
    volumes:
      - ../certs:/certs
    restart: 'no'

  traefik:
    image: traefik:v3.7.15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - ../certs:/certs:ro
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    networks: [broker]
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *small

  # ---------------------------------------------------------------- simuladores externos
  # Sem perfil: sobem com a infraestrutura. Cada um tem banco próprio e é acessado pelo núcleo
  # só pela API, como um terceiro (RN-SIM-001).

  pix-simulator-migrate:
    image: broker/pix-simulator:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/pix-simulator'
        # Commit no /info (RN-CICD-020); o `pnpm env:up` exporta o HEAD.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: pix_simulator
      DB_USER: pix_simulator_migrator
      DB_PASSWORD_FILE: /run/secrets/db_pix_simulator_migrator
    secrets: [db_pix_simulator_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  pix-simulator:
    image: broker/pix-simulator:local
    environment:
      <<: *simulator-env
      SERVICE_NAME: pix-simulator
      DB_NAME: pix_simulator
      DB_USER: pix_simulator_app
      DB_PASSWORD_FILE: /run/secrets/db_pix_simulator_app
      WEBHOOK_URL: ${PIX_WEBHOOK_URL:-http://ledger-service:8080/webhooks/pix-simulator}
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_pix_simulator
    secrets: [db_pix_simulator_app, webhook_pix_simulator]
    networks: [broker]
    depends_on:
      pix-simulator-migrate:
        condition: service_completed_successfully
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.bank.rule: Host(`bank.broker.localhost`)
      traefik.http.routers.bank.entrypoints: websecure
      traefik.http.services.bank.loadbalancer.server.port: '8080'

  kyc-simulator-migrate:
    image: broker/kyc-simulator:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/kyc-simulator'
        # Commit no /info (RN-CICD-020); o `pnpm env:up` exporta o HEAD.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: kyc_simulator
      DB_USER: kyc_simulator_migrator
      DB_PASSWORD_FILE: /run/secrets/db_kyc_simulator_migrator
    secrets: [db_kyc_simulator_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  kyc-simulator:
    image: broker/kyc-simulator:local
    environment:
      <<: *simulator-env
      SERVICE_NAME: kyc-simulator
      DB_NAME: kyc_simulator
      DB_USER: kyc_simulator_app
      DB_PASSWORD_FILE: /run/secrets/db_kyc_simulator_app
      WEBHOOK_URL: ${KYC_WEBHOOK_URL:-http://customer-service:8080/webhooks/kyc-simulator}
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_kyc_simulator
      KYC_RESULT_DELAY_MS: ${KYC_RESULT_DELAY_MS:-2000-10000}
    secrets: [db_kyc_simulator_app, webhook_kyc_simulator]
    networks: [broker]
    depends_on:
      kyc-simulator-migrate:
        condition: service_completed_successfully
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.kyc.rule: Host(`kyc.broker.localhost`)
      traefik.http.routers.kyc.entrypoints: websecure
      traefik.http.services.kyc.loadbalancer.server.port: '8080'

  message-sink-migrate:
    image: broker/message-sink:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/message-sink'
        # Commit no /info (RN-CICD-020); o `pnpm env:up` exporta o HEAD.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: message_sink
      DB_USER: message_sink_migrator
      DB_PASSWORD_FILE: /run/secrets/db_message_sink_migrator
    secrets: [db_message_sink_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  message-sink:
    image: broker/message-sink:local
    environment:
      <<: *simulator-env
      SERVICE_NAME: message-sink
      DB_NAME: message_sink
      DB_USER: message_sink_app
      DB_PASSWORD_FILE: /run/secrets/db_message_sink_app
      MAILBOX_URL: https://mail.broker.localhost
    secrets: [db_message_sink_app]
    networks: [broker]
    depends_on:
      message-sink-migrate:
        condition: service_completed_successfully
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.sms.rule: Host(`sms.broker.localhost`)
      traefik.http.routers.sms.entrypoints: websecure
      traefik.http.services.sms.loadbalancer.server.port: '8080'

  # ---------------------------------------------------------------- núcleo (perfil core)

  scheduler-migrate:
    profiles: [core]
    image: broker/scheduler-service:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/scheduler-service'
        # Commit no /info (RN-CICD-020); o `pnpm env:up` exporta o HEAD.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: scheduler
      DB_USER: scheduler_migrator
      DB_PASSWORD_FILE: /run/secrets/db_scheduler_migrator
    secrets: [db_scheduler_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Rotinas do dia e relógio do ambiente (líder único, RN-ENV-021). O sandbox usa
  # CLOCK_MODE=ACCELERATED; os testes de replay, VIRTUAL com advance_to.
  scheduler-service:
    profiles: [core]
    image: broker/scheduler-service:local
    command: ['node', '--import', '@broker/service-kit/telemetry', 'dist/main.js']
    environment:
      SERVICE_NAME: scheduler-service
      ENVIRONMENT: ${BROKER_ENVIRONMENT:-local}
      PORT: '8080'
      DB_HOST: postgres
      DB_NAME: scheduler
      DB_USER: scheduler_app
      DB_PASSWORD_FILE: /run/secrets/db_scheduler_app
      STREAM_HOST: rabbitmq
      STREAM_USER: broker
      STREAM_PASSWORD_FILE: /run/secrets/rabbitmq_password
      CLOCK_MODE: ${CLOCK_MODE:-REAL}
      CLOCK_START: ${CLOCK_START:-}
      CLOCK_SPEED_FACTOR: ${CLOCK_SPEED_FACTOR:-1}
      # Tópicos de onde vêm os routine.completed/failed dos donos das rotinas.
      ROUTINE_RESULT_CONTEXTS: ${ROUTINE_RESULT_CONTEXTS:-audit,customer}
      ADMIN_API_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    secrets: [db_scheduler_app, rabbitmq_password]
    networks: [broker]
    depends_on:
      scheduler-migrate:
        condition: service_completed_successfully
      # Os tópicos de ROUTINE_RESULT_CONTEXTS precisam existir antes dos consumidores.
      audit-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.scheduler.rule: Host(`scheduler.broker.localhost`)
      traefik.http.routers.scheduler.entrypoints: websecure
      traefik.http.services.scheduler.loadbalancer.server.port: '8080'

  identity-migrate:
    profiles: [core]
    image: broker/identity-service:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/identity-service'
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: identity
      DB_USER: identity_migrator
      DB_PASSWORD_FILE: /run/secrets/db_identity_migrator
    secrets: [db_identity_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Identidade e acesso (Autenticação §1–§5): OAuth 2.1 + PKCE, JWKS, MFA, sessões, assinatura.
  # E-mails de segurança vão direto para o Mailpit e o OTP por SMS para o message-sink.
  identity-service:
    profiles: [core]
    image: broker/identity-service:local
    command: ['node', '--import', '@broker/service-kit/telemetry', 'dist/main.js']
    environment:
      SERVICE_NAME: identity-service
      ENVIRONMENT: ${BROKER_ENVIRONMENT:-local}
      PORT: '8080'
      DB_HOST: postgres
      DB_NAME: identity
      DB_USER: identity_app
      DB_PASSWORD_FILE: /run/secrets/db_identity_app
      STREAM_HOST: rabbitmq
      STREAM_USER: broker
      STREAM_PASSWORD_FILE: /run/secrets/rabbitmq_password
      VALKEY_HOST: valkey
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      CLOCK_MODE: ${CLOCK_MODE:-REAL}
      CLOCK_START: ${CLOCK_START:-}
      FIELD_MASTER_KEY_FILE: /run/secrets/identity_field_master_key
      BLIND_INDEX_KEY_FILE: /run/secrets/identity_blind_index_key
      AUTH_ISSUER: https://auth.broker.localhost
      SMTP_HOST: mailpit
      MESSAGE_SINK_URL: http://message-sink:8080
      # customer.created e account.opened (account_id do token) e account.status_changed.
      CONSUME_CUSTOMER_EVENTS: ${IDENTITY_CONSUME_CUSTOMER_EVENTS:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    secrets:
      - db_identity_app
      - rabbitmq_password
      - valkey_password
      - identity_field_master_key
      - identity_blind_index_key
    networks: [broker]
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.identity.rule: Host(`auth.broker.localhost`)
      traefik.http.routers.identity.entrypoints: websecure
      traefik.http.services.identity.loadbalancer.server.port: '8080'

  customer-migrate:
    profiles: [core]
    image: broker/customer-service:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/customer-service'
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: customer
      DB_USER: customer_migrator
      DB_PASSWORD_FILE: /run/secrets/db_customer_migrator
    secrets: [db_customer_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Onboarding, KYC (simulador), saga de abertura, suitability, termos, status da conta e cadastro.
  customer-service:
    profiles: [core]
    image: broker/customer-service:local
    command: ['node', '--import', '@broker/service-kit/telemetry', 'dist/main.js']
    environment:
      SERVICE_NAME: customer-service
      ENVIRONMENT: ${BROKER_ENVIRONMENT:-local}
      PORT: '8080'
      DB_HOST: postgres
      DB_NAME: customer
      DB_USER: customer_app
      DB_PASSWORD_FILE: /run/secrets/db_customer_app
      STREAM_HOST: rabbitmq
      STREAM_USER: broker
      STREAM_PASSWORD_FILE: /run/secrets/rabbitmq_password
      VALKEY_HOST: valkey
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      CLOCK_MODE: ${CLOCK_MODE:-REAL}
      CLOCK_START: ${CLOCK_START:-}
      FIELD_MASTER_KEY_FILE: /run/secrets/customer_field_master_key
      BLIND_INDEX_KEY_FILE: /run/secrets/customer_blind_index_key
      AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      AUTH_ISSUER: https://auth.broker.localhost
      DOCUMENTS_S3_ENDPOINT: http://minio:9000
      # As URLs de upload vão para o navegador, que enxerga o MinIO pela porta publicada.
      DOCUMENTS_S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      DOCUMENTS_S3_ACCESS_KEY: broker
      DOCUMENTS_S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      KYC_URL: http://kyc-simulator:8080
      KYC_WEBHOOK_SECRET_FILE: /run/secrets/webhook_kyc_simulator
      PIX_URL: http://pix-simulator:8080
      SMTP_HOST: mailpit
      MESSAGE_SINK_URL: http://message-sink:8080
      # Liga quando o ledger-service (grupo 15) publicar ledger.negative_balance_*.
      CONSUME_LEDGER_EVENTS: ${CUSTOMER_CONSUME_LEDGER_EVENTS:-false}
      # Donos das pendências de encerramento (RN-ACC-012); sem os cinco, o encerramento fica indisponível.
      CLOSURE_CHECK_URLS: ${CUSTOMER_CLOSURE_CHECK_URLS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    secrets:
      - db_customer_app
      - rabbitmq_password
      - valkey_password
      - minio_root_password
      - webhook_kyc_simulator
      - customer_field_master_key
      - customer_blind_index_key
    networks: [broker]
    depends_on:
      customer-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.customer.rule: Host(`customer.broker.localhost`)
      traefik.http.routers.customer.entrypoints: websecure
      traefik.http.services.customer.loadbalancer.server.port: '8080'

