cenario: ME-009g MARKET tem prioridade máxima e o restante é cancelado; a referência muda com o preço
regras: [RN-AUC-011, RN-INS-040, RN-SES-005]
entradas:
  instrumento:
    { band_reference_price: '10.00', rejection_band_pct: '0.20', auction_random_end_max_s: 0 }
  fase: PRE_OPENING
  comandos:
    - { t: 1, cmd: PhaseChange, fase: PRE_OPENING, auction_id: L1, auction_end_t: 10 }
    - { t: 2, cmd: NewOrder, id: B1, side: BUY, qty: 100, price: '11.00', account: A }
    - { t: 3, cmd: NewOrder, id: M1, side: BUY, type: MARKET, qty: 300, account: B }
    - { t: 4, cmd: NewOrder, id: S1, side: SELL, qty: 200, price: '11.00', account: C }
    - { t: 10, cmd: PhaseChange, fase: CONTINUOUS, concludes: L1 }
    # Com a referência em 11,00, o teto de rejeição passa a 13,20 e o piso a 8,80.
    - { t: 11, cmd: NewOrder, id: R1, side: BUY, qty: 100, price: '8.79', account: D }
    - { t: 12, cmd: NewOrder, id: R2, side: SELL, qty: 100, price: '13.20', account: D }
saidas_esperadas:
  trades:
    - { buy: M1, sell: S1, price: '11.00', qty: 200, auction: L1 }
  canceladas:
    - { id: M1, qty: 100, reason: MARKET_NO_LIQUIDITY }
  rejeitadas:
    - { id: R1, reason: PRICE_OUTSIDE_REJECTION_BAND }
  leiloes:
    - { evento: FIM, price: '11.00', qty: 200, fim_efetivo_t: 10 }
  livro_final:
    bids: [{ price: '11.00', orders: [{ id: B1, qty: 100 }] }]
    asks: [{ price: '13.20', orders: [{ id: R2, qty: 100 }] }]
  fase: CONTINUOUS
