cenario: ME-004c FOK executável preenche por inteiro; o STP e o túnel entram na simulação
regras: [RN-ME-030]
entradas:
  instrumento:
    {
      band_reference_price: '10.00',
      dynamic_auction_band_pct: '0.50',
      static_auction_band_pct: '0.02',
    }
  comandos:
    - { t: 1, cmd: NewOrder, id: S1, side: SELL, qty: 100, price: '10.00', account: X }
    - { t: 2, cmd: NewOrder, id: S2, side: SELL, qty: 100, price: '10.30', account: Y }
    # 200 cabem no limite, mas o 2º nível dispararia leilão pelo túnel estático: nada executa.
    - { t: 3, cmd: NewOrder, id: F1, side: BUY, qty: 200, price: '10.50', tif: FOK, account: W }
    - { t: 4, cmd: NewOrder, id: S3, side: SELL, qty: 100, price: '10.00', account: W }
    # 200 em 10,00, mas S3 é da própria conta e a política padrão cancelaria a agressora.
    - { t: 5, cmd: NewOrder, id: F2, side: BUY, qty: 200, price: '10.00', tif: FOK, account: W }
    # Cabe: só S1.
    - { t: 6, cmd: NewOrder, id: F3, side: BUY, qty: 100, price: '10.00', tif: FOK, account: Z }
saidas_esperadas:
  trades:
    - { buy: F3, sell: S1, price: '10.00', qty: 100 }
  canceladas:
    - { id: F1, qty: 200, reason: FOK_NOT_FILLED }
    - { id: F2, qty: 200, reason: FOK_NOT_FILLED }
  livro_final:
    bids: []
    asks:
      - { price: '10.00', orders: [{ id: S3, qty: 100 }] }
      - { price: '10.30', orders: [{ id: S2, qty: 100 }] }
  fase: CONTINUOUS
