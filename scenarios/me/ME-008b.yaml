cenario: ME-008b túnel estático dispara leilão; MARKET vai ao leilão como mercado e IOC cancela
regras: [RN-AUC-030, RN-AUC-031]
entradas:
  instrumento:
    {
      band_reference_price: '10.00',
      static_auction_band_pct: '0.08',
      dynamic_auction_band_pct: '0.50',
    }
  comandos:
    - { t: 1, cmd: NewOrder, id: S1, side: SELL, qty: 100, price: '10.90', account: X }
    - { t: 2, cmd: NewOrder, id: I1, side: BUY, qty: 100, price: '11.00', tif: IOC, account: Z }
    # A IOC parou no túnel e já abriu o leilão: não entra nele.
    - { t: 3, cmd: NewOrder, id: M1, side: BUY, type: MARKET, qty: 100, account: W }
saidas_esperadas:
  trades: []
  canceladas:
    - { id: I1, qty: 100, reason: IOC_REMAINDER }
  leiloes:
    - { evento: INICIO, tipo: VOLATILITY, motivo: STATIC_BAND, fim_previsto_t: 302 }
  livro_final:
    bids: [{ price: MARKET, orders: [{ id: M1, qty: 100 }] }]
    asks: [{ price: '10.90', orders: [{ id: S1, qty: 100 }] }]
  fase: VOLATILITY_AUCTION
