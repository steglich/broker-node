name: Preparar o workspace
description: Node da .nvmrc, pnpm do packageManager e dependências com o lockfile congelado.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Instalar dependências
      shell: bash
      run: pnpm install --frozen-lockfile
