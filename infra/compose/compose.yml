        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.ledger.rule: Host(`ledger.broker.localhost`)
      traefik.http.routers.ledger.entrypoints: websecure
      traefik.http.services.ledger.loadbalancer.server.port: '8080'

  reference-data-migrate:
    profiles: [core]
    image: broker/reference-data-service:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/reference-data-service'
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: reference_data
      DB_USER: reference_data_migrator
      DB_PASSWORD_FILE: /run/secrets/db_reference_data_migrator
    secrets: [db_reference_data_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Instrumentos, universo negociável (dupla aprovação local até o approval-service), regras de
  # negociação com vigência, histórico de tickers, calendário e grade horária. No sandbox,
  # CALENDAR_ALL_DAYS_BUSINESS=true (RN-SBX-002).
  reference-data-service:
    profiles: [core]
    image: broker/reference-data-service:local
    command: ['node', '--import', '@broker/service-kit/telemetry', 'dist/main.js']
    environment:
      SERVICE_NAME: reference-data-service
      ENVIRONMENT: ${BROKER_ENVIRONMENT:-local}
      PORT: '8080'
      DB_HOST: postgres
      DB_NAME: reference_data
      DB_USER: reference_data_app
      DB_PASSWORD_FILE: /run/secrets/db_reference_data_app
      STREAM_HOST: rabbitmq
      STREAM_USER: broker
      STREAM_PASSWORD_FILE: /run/secrets/rabbitmq_password
      VALKEY_HOST: valkey
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      CLOCK_MODE: ${CLOCK_MODE:-REAL}
      CLOCK_START: ${CLOCK_START:-}
      AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      AUTH_ISSUER: https://auth.broker.localhost
      MAX_TRADABLE_INSTRUMENTS: ${MAX_TRADABLE_INSTRUMENTS:-20}
      CALENDAR_ALL_DAYS_BUSINESS: ${CALENDAR_ALL_DAYS_BUSINESS:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    secrets:
      - db_reference_data_app
      - rabbitmq_password
      - valkey_password
    networks: [broker]
    depends_on:
      reference-data-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.reference.rule: Host(`reference.broker.localhost`)
      traefik.http.routers.reference.entrypoints: websecure
      traefik.http.services.reference.loadbalancer.server.port: '8080'

  market-data-migrate:
    profiles: [core]
    image: broker/market-data-service:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/market-data-service'
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: market_data
      DB_USER: market_data_migrator
      DB_PASSWORD_FILE: /run/secrets/db_market_data_migrator
    secrets: [db_market_data_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Adaptador da brapi (orçamento, fila única com líder, cache, quarentena), catálogo, histórico
  # diário, Ibovespa e preço de referência. Local: MARKET_DATA_PROVIDER=fixture (RN-BRP-095); com
  # `brapi`, o token vem de infra/secrets/brapi/token.
  market-data-service:
    profiles: [core]
    image: broker/market-data-service:local
    command: ['node', '--import', '@broker/service-kit/telemetry', 'dist/main.js']
    environment:
      SERVICE_NAME: market-data-service
      ENVIRONMENT: ${BROKER_ENVIRONMENT:-local}
      PORT: '8080'
      DB_HOST: postgres
      DB_NAME: market_data
      DB_USER: market_data_app
      DB_PASSWORD_FILE: /run/secrets/db_market_data_app
      STREAM_HOST: rabbitmq
      STREAM_USER: broker
      STREAM_PASSWORD_FILE: /run/secrets/rabbitmq_password
      VALKEY_HOST: valkey
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: broker
      S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      CLOCK_MODE: ${CLOCK_MODE:-REAL}
      CLOCK_START: ${CLOCK_START:-}
      AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      AUTH_ISSUER: https://auth.broker.localhost
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-fixture}
      BRAPI_TOKEN_FILE: /run/secrets/brapi_token
      BRAPI_TOKEN_NEXT_FILE: /run/secrets/brapi_token_next
      BRAPI_SCHEMA_CHECK_ENABLED: ${BRAPI_SCHEMA_CHECK_ENABLED:-false}
      SYNTHETIC_NOISE_ENABLED: ${SYNTHETIC_NOISE_ENABLED:-true}
      CALENDAR_ALL_DAYS_BUSINESS: ${CALENDAR_ALL_DAYS_BUSINESS:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    secrets:
      - db_market_data_app
      - rabbitmq_password
      - valkey_password
      - minio_root_password
      - brapi_token
      - brapi_token_next
    networks: [broker]
    depends_on:
      market-data-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.market-data.rule: Host(`market-data.broker.localhost`)
      traefik.http.routers.market-data.entrypoints: websecure
      traefik.http.services.market-data.loadbalancer.server.port: '8080'

  audit-migrate:
    profiles: [core]
    image: broker/audit-service:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/audit-service'
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: audit
      DB_USER: audit_migrator
      DB_PASSWORD_FILE: /run/secrets/db_audit_migrator
    secrets: [db_audit_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Trilha de auditoria (RN-AUD-001..005): consome os eventos auditable/audit.* dos tópicos de
  # AUDIT_SOURCE_CONTEXTS, verifica a cadeia e grava a âncora diária no bucket audit-anchors.
  audit-service:
    profiles: [core]
    image: broker/audit-service:local
    command: ['node', '--import', '@broker/service-kit/telemetry', 'dist/main.js']
    environment:
      SERVICE_NAME: audit-service
      ENVIRONMENT: ${BROKER_ENVIRONMENT:-local}
      PORT: '8080'
      DB_HOST: postgres
      DB_NAME: audit
      DB_USER: audit_app
      DB_PASSWORD_FILE: /run/secrets/db_audit_app
      STREAM_HOST: rabbitmq
      STREAM_USER: broker
      STREAM_PASSWORD_FILE: /run/secrets/rabbitmq_password
      CLOCK_MODE: ${CLOCK_MODE:-REAL}
      CLOCK_START: ${CLOCK_START:-}
      AUDIT_SOURCE_CONTEXTS: ${AUDIT_SOURCE_CONTEXTS:-}
      ANCHOR_S3_ENDPOINT: http://minio:9000
      ANCHOR_S3_ACCESS_KEY: broker
      ANCHOR_S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      # identity-service: um emissor para os dois realms; o realm vai no claim `realm`.
      AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      AUTH_ISSUER: https://auth.broker.localhost
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    secrets: [db_audit_app, rabbitmq_password, minio_root_password]
    networks: [broker]
    depends_on:
      audit-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    <<: [*ready-check, *small]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.audit.rule: Host(`audit.broker.localhost`)
      traefik.http.routers.audit.entrypoints: websecure
      traefik.http.services.audit.loadbalancer.server.port: '8080'

  # ---------------------------------------------------------------- serviços
  # Padrão de um serviço: imagem do Dockerfile único (SERVICE=<pacote>), um one-shot de
  # migração com o usuário <svc>_migrator e o serviço com <svc>_app, que só sobe depois
  # que a migração termina com sucesso.

  # Serviço de exemplo da Fase 0 (perfil full). Sai quando houver serviços reais.
  example-migrate:
    profiles: [full]
    image: broker/example-service:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: '@broker/example-service'
        # Commit no /info (RN-CICD-020); o `pnpm env:up` exporta o HEAD.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ['node', 'dist/migrate.js']
    environment:
      DB_HOST: postgres
      DB_NAME: example
      DB_USER: example_migrator
      DB_PASSWORD_FILE: /run/secrets/db_example_migrator
    secrets: [db_example_migrator]
    networks: [broker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  example-service:
    profiles: [full]
    image: broker/example-service:local
    # A telemetria precisa ser carregada antes do código do serviço (ESM).
    command: ['node', '--import', '@broker/service-kit/telemetry', 'dist/main.js']
    environment:
      SERVICE_NAME: example-service
      ENVIRONMENT: local
      PORT: '8080'
      DB_HOST: postgres
      DB_NAME: example
      DB_USER: example_app
      DB_PASSWORD_FILE: /run/secrets/db_example_app
      STREAM_HOST: rabbitmq
      STREAM_USER: broker
      STREAM_PASSWORD_FILE: /run/secrets/rabbitmq_password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    secrets: [db_example_app, rabbitmq_password]
    networks: [broker]
    depends_on:
      example-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      traefik.enable: 'true'
      traefik.http.routers.example.rule: Host(`example.broker.localhost`)
      traefik.http.routers.example.entrypoints: websecure
      traefik.http.services.example.loadbalancer.server.port: '8080'
    <<: *small
