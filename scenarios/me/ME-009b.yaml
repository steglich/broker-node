cenario: ME-009b preço teórico, critério 2 - menor desequilíbrio
regras: [RN-AUC-010]
entradas:
  instrumento: { band_reference_price: '10.00', auction_random_end_max_s: 0 }
  fase: PRE_OPENING
  comandos:
    - { t: 1, cmd: PhaseChange, fase: PRE_OPENING, auction_id: L1, auction_end_t: 10 }
    - { t: 2, cmd: NewOrder, id: B1, side: BUY, qty: 100, price: '10.03', account: A }
    - { t: 3, cmd: NewOrder, id: B2, side: BUY, qty: 100, price: '10.01', account: B }
    - { t: 4, cmd: NewOrder, id: S1, side: SELL, qty: 100, price: '10.01', account: C }
    - { t: 5, cmd: NewOrder, id: S2, side: SELL, qty: 200, price: '10.03', account: D }
    - { t: 10, cmd: PhaseChange, fase: CONTINUOUS, concludes: L1 }
saidas_esperadas:
  # 10,01: demanda 200, oferta 100 (exec 100, deseq. 100). 10,03: demanda 100, oferta 300 (exec 100, deseq. 200).
  trades:
    - { buy: B1, sell: S1, price: '10.01', qty: 100, auction: L1 }
  leiloes:
    - { evento: FIM, price: '10.01', qty: 100, fim_efetivo_t: 10 }
  livro_final:
    bids: [{ price: '10.01', orders: [{ id: B2, qty: 100 }] }]
    asks: [{ price: '10.03', orders: [{ id: S2, qty: 200 }] }]
  fase: CONTINUOUS
