cenario: ME-013 encerramento aleatório dentro da janela, reprodutível pela semente
regras: [RN-AUC-033, RN-ME-002]
entradas:
  instrumento: { band_reference_price: '10.00', auction_random_end_max_s: 30 }
  fase: PRE_OPENING
  comandos:
    - { t: 1, cmd: PhaseChange, fase: PRE_OPENING, auction_id: L1, auction_end_t: 100, seed: '42' }
    - { t: 2, cmd: NewOrder, id: B1, side: BUY, qty: 100, price: '10.00', account: A }
    - { t: 3, cmd: NewOrder, id: S1, side: SELL, qty: 100, price: '10.00', account: B }
    - { t: 100, cmd: PhaseChange, fase: CONTINUOUS, concludes: L1 }
    # Antes do instante sorteado, o leilão segue aberto e as ordens seguem acumulando.
    - { t: 101, cmd: NewOrder, id: B2, side: BUY, qty: 100, price: '10.00', account: C }
    - { t: 131, cmd: Tick }
  repetir: true
saidas_esperadas:
  trades:
    - { buy: B1, sell: S1, price: '10.00', qty: 100, auction: L1 }
  leiloes:
    - { evento: FIM, price: '10.00', qty: 100, fim_efetivo_t: 118.033 }
  livro_final:
    bids: [{ price: '10.00', orders: [{ id: B2, qty: 100 }] }]
    asks: []
  fase: CONTINUOUS
  reprodutivel: true
