cenario: ME-009a preço teórico, critério 1 - maior executável
regras: [RN-AUC-010, RN-AUC-021, RN-AUC-022]
entradas:
  instrumento: { band_reference_price: '10.00', auction_random_end_max_s: 0 }
  fase: PRE_OPENING
  comandos:
    - { t: 1, cmd: PhaseChange, fase: PRE_OPENING, auction_id: L1, auction_end_t: 10 }
    - { t: 2, cmd: NewOrder, id: B1, side: BUY, qty: 300, price: '10.02', account: X }
    - { t: 3, cmd: NewOrder, id: S1, side: SELL, qty: 100, price: '10.00', account: Y }
    - { t: 4, cmd: NewOrder, id: S2, side: SELL, qty: 300, price: '10.02', account: Z }
    - { t: 10, cmd: PhaseChange, fase: CONTINUOUS, concludes: L1 }
saidas_esperadas:
  # 10,00 executa 100; 10,02 executa 300. Todos ao mesmo preço, por prioridade.
  trades:
    - { buy: B1, sell: S1, price: '10.02', qty: 100, auction: L1 }
    - { buy: B1, sell: S2, price: '10.02', qty: 200, auction: L1 }
  leiloes:
    - { evento: FIM, price: '10.02', qty: 300, fim_efetivo_t: 10 }
  livro_final:
    bids: []
    asks: [{ price: '10.02', orders: [{ id: S2, qty: 100 }] }]
  fase: CONTINUOUS
