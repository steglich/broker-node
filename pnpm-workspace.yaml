packages:
  - 'apps/*'
  - 'packages/*'
  - 'contracts'
  - 'scenarios'
  - 'infra'

# Scripts de instalação bloqueados: todos opcionais (binários pré-compilados ou aceleração nativa).
allowBuilds:
  unrs-resolver: false
  esbuild: false
  cpu-features: false
  ssh2: false
  protobufjs: false

# Necessário para `pnpm deploy` copiar os pacotes do workspace para a imagem (D22).
injectWorkspacePackages: true

# Correções de segurança em dependências transitivas que fixam a versão (osv-scanner, RN-CICD §2).
# Remova quando a dependência de origem subir a versão.
overrides:
  # testcontainers@12.2.0 fixa undici@8.11.2 (GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472).
  'undici@>=8.0.0 <8.12.2': 8.12.2
