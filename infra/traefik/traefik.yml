# Configuração estática do Traefik (D9).
entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    http:
      tls: {}

providers:
  docker:
    exposedByDefault: false
    network: broker
  file:
    directory: /etc/traefik/dynamic
    watch: true

ping: {}
api:
  dashboard: true

log:
  level: INFO
accessLog: {}
